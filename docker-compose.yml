version: '3.8'

services:
  # 1. Database Service (Chỉ sử dụng ở môi trường Local)
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_DB: todo_db
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: todo_password
    ports:
      - "5439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Backend Service (Spring Boot API)
  backend:
    build: ./backend
    container_name: todo-backend
    restart: always
    ports:
      - "8082:8085"
    environment:
      # Override thông số kết nối Database tới container postgres-db local
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/todo_db
      - SPRING_DATASOURCE_USERNAME=todo_user
      - SPRING_DATASOURCE_PASSWORD=todo_password
    depends_on:
      - postgres-db

  # 3. Frontend Service (React + Nginx)
  frontend:
    build: ./frontend
    container_name: todo-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
